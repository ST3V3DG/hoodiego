apiVersion: v1
kind: Pod
metadata:
  name: hoodiego
spec:
  containers:
  - name: hoodiego
    image: hoodiego:latest
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "250m"
    ports:
      - containerPort: 3000
